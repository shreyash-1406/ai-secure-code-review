<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Secure Code Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">🛡️ AI Secure Code Review</a>
    <nav>
      <a href="{{ url_for('index') }}">New review</a>
      <a href="{{ url_for('history') }}">History</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Static rules + local LLM · findings are leads for human review, not final verdicts</footer>
</body>
</html>
